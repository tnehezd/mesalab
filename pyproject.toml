[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mesalab"
version = "2.1.0"
requires-python = ">=3.9, <3.12"
readme = "README.md"


dependencies = [
    "numpy>=1.21.6,<2.0",
    "pandas>=1.3.5,<2.1",
    "scipy>=1.7.3,<1.11",
    "numba>=0.56.4,<0.58",
    "astropy>=4.3.1,<6.0",
    "seaborn>=0.12.2,<0.13",
    "matplotlib>=3.5.3",
    "PyYAML>=6.0.1",
    "tqdm>=4.67.1",
    "isochrones>=2.1",
    "pygyre>=1.3.2",
    "swifter>=1.4.0",
    "f90nml>=1.4.5",
    "addict",
]
