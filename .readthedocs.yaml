version: 2

build:
  os: "ubuntu-22.04"
  tools:
    python: "3.11"  # Emeljük fel 3.11-re, ahogy a gépeden is van!

# A python blokkban szigorúan a requirements fusson le ELŐSZÖR, és csak utána a projekt telepítése
python:
  install:
    - requirements: docs/requirements.txt
    - method: pip
      path: .

# A sphinx futtatását hagyjuk a legvégére, amikor már minden fent van
sphinx:
  configuration: docs/conf.py